<style>
:root{--bg:#FBF7F1;--fg:#2A2420;--muted:#6B6058;--card:#fff;--line:#E8DED2}
@media (prefers-color-scheme:dark){:root{--bg:#1B1816;--fg:#F3EDE6;--muted:#B5AAA0;--card:#262220;--line:#3A332E}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px} h2{font-size:1.15rem;margin:36px 0 12px} p{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.card{margin:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}
.big{width:160px;height:160px;border-radius:36px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
figcaption{display:flex;flex-direction:column;gap:4px;margin-top:12px;text-align:left} figcaption span{color:var(--muted);font-size:.95rem}
.phone{background:linear-gradient(160deg,#5A6B8C,#2C3550);border-radius:28px;padding:24px 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;max-width:420px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px}
.app img,.fake{width:60px;height:60px;border-radius:14px}
.app small{color:#fff;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.5);white-space:nowrap}
</style></head><body><main>
